</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keuangan Admin | Admin</title><style>
:root{--yellow:#ffcc00;--bg:#f1f2f4;--muted:#64756f}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 system-ui,sans-serif}
.top{background:#111;color:#fff;padding:12px 16px 32px;border-radius:0 0 24px 24px}.topline{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.left{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:8px;background:#222;object-fit:cover;border:1px solid #333}
.brand{color:var(--yellow);font-weight:900;font-size:16px}.sub{color:#c7cbd0;font-size:11px}.sub-yellow{color:var(--yellow);font-size:12px;font-weight:800}
main{max-width:1100px;margin:-18px auto 0;padding:0 12px 80px}.panel{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 20px #0001}
.btn{border:0;border-radius:10px;background:var(--yellow);padding:10px 14px;font-weight:800;cursor:pointer}.btn.dark{background:#111;color:var(--yellow)}
.list{display:grid;gap:8px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:12px;background:#fff}.meta{font-size:11px;color:var(--muted)}
.hidden{display:none!important}.err{color:#b42318;background:#fdecea;border:1px solid #f5c6c1;border-radius:8px;padding:8px;font-size:12px}.ok{color:#087443;background:#e6f7ef;border:1px solid #c3ead7;border-radius:8px;padding:8px}
.log{font-size:11px;background:#111;color:#0f0;padding:8px;border-radius:8px;white-space:pre-wrap;max-height:120px;overflow:auto}

</style></head><body>
<div class="top"><div class="topline"><div class="left"><img src="./logo2.png" class="logo" alt="logo" onerror="this.style.display='none'"><div><div class="brand">TOKO SIAP ANTAR</div><div id="accountNameTop" class="sub-yellow">Admin</div><div class="sub">Laba, Modal, Ongkir + Transaksi</div></div></div><a class="back" href="./admin-dashboard-rapi-v3-logo-header.html">← Menu Admin</a></div></div>
<main><div class="panel"><h1 style="margin:0 0 6px">Keuangan Admin</h1><p style="margin:0;font-size:11px;color:var(--muted)">Laba, Modal, Ongkir + Transaksi - Auto Saldo (saldo masuk otomatis, pencairan butuh verifikasi)</p><div id="log" class="log"></div></div><div id="content" class="panel">Memuat...</div></main>
<script type="module">
import {auth,db} from "./firebase-config.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {doc,getDoc,collection,getDocs,query,where,limit,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const $=id=>document.getElementById(id);
async function requireAdmin(u){
  const ps=await getDoc(doc(db,"users",u.uid));
  if(!ps.exists()) throw new Error("Profil akun tidak ditemukan.");
  const p=ps.data(), role=String(p.role||"").toLowerCase();
  if(!["admin","superadmin"].includes(role)) throw new Error("Akses ditolak. Halaman ini khusus Admin/Superadmin.");
  if(p.status==="nonaktif" || p.aktif===false) throw new Error("Akun admin sedang nonaktif.");
  return p;
}

const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rupiah(n){return 'Rp '+(Number(n)||0).toLocaleString('id-ID');}
function log(m){ const el=$("log"); if(el) el.textContent+="\n"+m; }
async function loadAccountName(u){ try{ const s=await getDoc(doc(db,"users",u.uid)); const p=s.data(); if(p) $("accountNameTop").textContent="Halo, Kak, "+(p.nama||p.namaUsaha||u.email); }catch(e){} }

onAuthStateChanged(auth, async u=>{
  if(!u){ $("content").innerHTML='Login'; return; }
  try{ await requireAdmin(u); }catch(e){ $("content").innerHTML='<div class="err">'+esc(e.message)+'</div>'; return; }
  loadAccountName(u);
  try{
    const snap=await getDocs(query(collection(db,"orders"), where("status","==","selesai"), limit(100)));
    let jual=0, modal=0, ongkir=0, laba=0;
    snap.forEach(d=>{ const o=d.data(); jual+=Number(o.total||0); modal+=Number(o.mitraModalTotal||o.modalTotal||0); ongkir+=Number(o.ongkir||0); laba+=Number(o.labaAdmin||Math.max(0, Number(o.total||0)-Number(o.mitraModalTotal||0)-Number(o.ongkir||0))); });
    const txSnap=await getDocs(query(collection(db,"wallet_transactions"), limit(30)));
    let txHtml=txSnap.docs.map(d=>{ const t=d.data(); return `<div class="item"><strong>${esc(t.type)}</strong> - ${rupiah(t.amount)}<br><span class="meta">${esc(t.nomorPesanan||t.orderId||'')} | ${t.createdAt?.toDate?.()?.toLocaleString?.()||''}</span></div>`; }).join('');
    $("content").innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="item"><div class="meta">Total Jual</div><strong>${rupiah(jual)}</strong></div><div class="item"><div class="meta">Total Modal</div><strong>${rupiah(modal)}</strong></div><div class="item"><div class="meta">Total Ongkir</div><strong>${rupiah(ongkir)}</strong></div><div class="item" style="background:#111;color:var(--yellow)"><div class="meta" style="color:#c7cbd0">Total Laba Admin</div><strong>${rupiah(laba)}</strong></div></div><h3 style="margin-top:12px">Transaksi Auto Terbaru</h3><div class="list">${txHtml||'<div class="meta">Belum ada</div>'}</div>`;
  }catch(e){ $("content").innerHTML='<div class="err">'+esc(e.message)+'</div>'; log(e.message); }
});

</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.proto
